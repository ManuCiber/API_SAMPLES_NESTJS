version: '3.9'

services:
  # ============================================================================
  # PostgreSQL Database Service
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: api-muestras-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-muestras_medicas}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # NestJS Application Service
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-muestras-app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-muestras_medicas}}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-medical-samples}
      PORT: ${PORT:-3001}
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./src:/app/src:ro
      - ./prisma:/app/prisma:ro
    command: pnpm run start:dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
